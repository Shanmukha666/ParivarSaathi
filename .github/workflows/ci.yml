name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    env:
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: services/api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -q
      - name: 60-conversation safety and grounding evaluation
        run: python run_evaluation.py

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npm run test:i18n
      - run: npm run test:voice
      - name: Production build (fonts are self-hosted, so no network needed)
        run: npm run build

  database:
    name: migrations and row-level security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: parivar_ci
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration in order, then run the RLS red-team suite
        run: bash tools/verify_rls.sh
      - name: seed.sql applies cleanly on top, and twice (idempotent)
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql -X -q -v ON_ERROR_STOP=1 -f supabase/seed.sql
